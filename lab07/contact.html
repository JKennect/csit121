<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - TierDestroyers</title> 
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <header>
    <h1>TierDestroyers.Net</h1>
    </header>
    <nav>
        <a href="tierlist.html">GPU Tier List</a>
        <a href="contact.html">Contact us</a>
    </nav>
    <main>
        <h2 style="margin: 10px;">Contact Us:</h2>
        <form>
            <label for="fname">First name:</label><br>
            <input type="text" id="fname" name="fname"><br><br>
            <label for="lname">Last name:</label><br>
            <input type="text" id="lname" name="lname"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email">
            <p>Reason for Contact:</p>
            <input type="radio" id="newlist" name="reason" value="Requesting new tier list">
            <label for="newlist">Requesting a new tier list</label><br>
            <input type="radio" id="hatelist" name="reason" value="I hate a tier list on the site">
            <label for="hatelist">I hate a tier list on the site</label><br><br>
            <input type="submit">
            <input type="reset">
        </form>
    </main>
    <footer style="margin-top: 200px;">
        <p>&copy; 2026 Jamal Kennard</p>
    </footer>
</body>
</html>
